name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: bash build.sh

      - name: Zip app bundle
        run: cd dist && zip -r "Claude.Usage.Bar.app.zip" "Claude Usage Bar.app"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/Claude.Usage.Bar.app.zip"
